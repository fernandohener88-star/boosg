<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<figure data-img-id="{{ imgId }}" class="og-fig" style="position:absolute;inset:0;margin:0;overflow:hidden;isolation:isolate;background:#1D1B19;background-image:{{ raster }};background-size:36px 36px;border:{{ rahmen }};">
  <img src="{{ src }}" alt="{{ alt }}" loading="{{ laden }}" fetchpriority="{{ prio }}" decoding="async" class="og-foto" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:{{ pos }};display:{{ fotoDisp }};z-index:2;">
  <div role="img" aria-label="{{ planLabel }}" style="position:absolute;inset:0;display:{{ planDisp }};">{{ plan }}</div>
  <div aria-hidden="true" style="display:{{ ecken }};position:absolute;top:0;left:0;width:18px;height:18px;border-top:1px solid rgba(185,138,90,.55);border-left:1px solid rgba(185,138,90,.55);"></div>
  <div aria-hidden="true" style="display:{{ ecken }};position:absolute;bottom:0;right:0;width:18px;height:18px;border-bottom:1px solid rgba(185,138,90,.55);border-right:1px solid rgba(185,138,90,.55);"></div>
  <div aria-hidden="true" style="display:{{ kopfDisp }};position:absolute;top:11px;left:13px;right:13px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10px;font-weight:500;letter-spacing:.16em;color:#B98A5A;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ kopf }}</div>
  <div aria-hidden="true" style="display:{{ markeDisp }};position:absolute;inset:0;place-items:center;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;letter-spacing:.2em;color:rgba(185,138,90,.7);">O&amp;G</div>
  <div aria-hidden="true" style="display:{{ fussDisp }};position:absolute;bottom:11px;right:13px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:9px;font-weight:500;letter-spacing:.16em;color:rgba(168,160,150,.7);white-space:nowrap;">{{ fuss }}</div>
</figure>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:525},&quot;imgId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;REF-02&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;alt&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;motif&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;laden&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;lazy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;deko&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
/* Bild-Komponente: 1) echtes Foto aus window.OG_IMAGES (Alt-Text und Ausschnitt aus bilder/bilder.json),
   2) sonst Planskizze aus window.OG_PLAN (quelle/plaene.js), 3) sonst neutrales Markenmotiv.
   Graue Prototyp-Platzhalter mit Bild-IDs gibt es nicht mehr. */
class Component extends DCLogic {
  renderVals() {
    const p = this.props, W = typeof window !== 'undefined' ? window : {};
    const id = p.imgId ?? '';
    const foto = (W.OG_IMAGES || {})[id] || null;
    const plan = !foto && W.OG_PLAN ? W.OG_PLAN(React, id) : null;
    const raster = foto ? 'none' : 'linear-gradient(rgba(168,160,150,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(168,160,150,.07) 1px,transparent 1px)';
    const mono = plan && plan.typ === 'monogramm';
    return {
      imgId: id,
      src: foto ? foto.u : undefined,
      alt: p.deko ? '' : ((foto && foto.alt) || p.alt || ''),
      pos: (foto && foto.pos) || '50% 50%',
      laden: p.laden || 'lazy',
      prio: p.laden === 'eager' ? 'high' : 'auto',
      fotoDisp: foto ? 'block' : 'none',
      raster,
      rahmen: foto ? '0' : '1px solid rgba(168,160,150,.16)',
      plan: plan ? plan.el : null,
      planDisp: plan ? 'block' : 'none',
      planLabel: plan ? (mono ? (p.alt || 'Monogramm') : 'Skizze: ' + plan.titel) : undefined,
      ecken: foto ? 'none' : 'block',
      kopfDisp: plan && plan.titel ? 'block' : 'none',
      kopf: plan && plan.titel ? 'SKIZZE · ' + plan.titel.toUpperCase() : '',
      fussDisp: plan && plan.blatt ? 'block' : 'none',
      fuss: plan && plan.blatt ? 'OCHS & GRAF · ' + plan.blatt : '',
      markeDisp: !foto && !plan ? 'grid' : 'none'
    };
  }
}
</script>
</body>
</html>
